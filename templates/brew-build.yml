spec:
  inputs:
    stage:
      description: The pipeline stage where to do brew build test
      default: test
    runner:
      description: GitLab CI runner tag (must be MacOS with brew available)
      default: mac-arm-runner
    formula:
      description: The path of the formula in the homebrew repository (e.g. m/mender-artifact.rb)
    repo:
      description: Repository which the tested revision lives in (determined from the formula by default)
      default: ""
---

$[[ inputs.stage ]]:build:brew:
  stage: $[[ inputs.stage ]]
  tags:
    - $[[ inputs.runner ]]
  needs: []
  variables:
    HOMEBREW_DEVELOPER: 1
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - stuck_or_timeout_failure
  rules:
    # Manually run job. Note that this variable is not shown by default
    # in the pipelines that include this component.
    - if: $BUILD_BREW == "true"
      when: on_success
    # Run on default branch
    - if: "$CI_COMMIT_BRANCH = $CI_DEFAULT_BRANCH"
      when: on_success
    # Exclude production branches
    - if: $CI_COMMIT_BRANCH =~ "/^(master|main|hosted|staging|production)$/"
      when: never
    # Exclude maintenance branches
    - if: $CI_COMMIT_BRANCH =~ "/^([0-9]+\.[0-9]+\.x|v[0-9]+\.[0-9]+\.x)$/"
      when: never
    # Exclude tags
    - if: $CI_COMMIT_TAG
      when: never
    # Run for every other case
    - when: on_success
  before_script:
    # This job runs with HOMEBREW_NO_INSTALL_FROM_API=1 (see the build step below),
    # which makes brew full-clone the homebrew/core tap. Since ~2026-10-08 that clone
    # fails on the ~1.2 GB pack with "curl 56 Recv failure: Connection reset by peer"
    # / "early EOF" / "fetch-pack: invalid index-pack output", killing the job.
    # Do a shallow clone first. Brew then finds the tap present and skips its own full
    # clone.
    # We run `brew install gnu-sed wget` FIRST so brew's one-time auto-update happens
    # while no git tap exists yet so that brew does not do a full clone during
    # auto update.
    - brew install gnu-sed wget
    - |
        CORE_TAP="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
        if [ -d "${CORE_TAP}/.git" ]; then
          echo "homebrew/core tap already present; skipping clone."
        elif [ -e "${CORE_TAP}" ]; then
          echo "ERROR: ${CORE_TAP} exists but is not a git repository; aborting." >&2
          exit 1
        else
          cloned=false
          for attempt in 1 2 3; do
            echo "Cloning homebrew/core (shallow, depth=1), attempt ${attempt}..."
            if git clone --depth=1 https://github.com/Homebrew/homebrew-core "${CORE_TAP}"; then
              cloned=true
              break
            fi
            echo "homebrew/core clone attempt ${attempt} failed; retrying..."
            rm -rf "${CORE_TAP}"
            sleep 5
          done
          if [ "${cloned}" != true ]; then
            echo "ERROR: failed to clone homebrew/core after 3 attempts; aborting." >&2
            exit 1
          fi
        fi
  script:
    - FORMULA_FILE="$(basename $[[ inputs.formula ]])"
    - FORMULA_NAME="${FORMULA_FILE%%.*}"
    - REPO="$FORMULA_NAME"
    - test -z "$[[ inputs.repo ]]" || REPO="$[[ inputs.repo ]]"
    - TEMP_BUILD_DIR="/tmp/brew_build_${CI_PIPELINE_ID}"
    - mkdir "$TEMP_BUILD_DIR"
    - cd "$TEMP_BUILD_DIR"
    # 1. get the custom download strategy for brew so that we can fetch a PR revision from GH
    - wget -O $FORMULA_FILE https://raw.githubusercontent.com/mendersoftware/mendertesting/master/gh_pr_brew_dl_strategy.rb
    - echo >> $FORMULA_FILE # Make sure there's a newline after download strategy class
    # 2. fetch the upstream brew formula
    - wget -O ${FORMULA_NAME}_upstream.rb "https://github.com/Homebrew/homebrew-core/raw/refs/heads/main/Formula/$[[ inputs.formula ]]"
    # 3. adapt the formula to use the PR revision instead of a release tarball
    - |
        gsed -e /sha256/d -e "/url /s|\".*\"|\"https://github.com/mendersoftware/${REPO}.git\",|" -e "/url \"https/a\ \ \ \ revision: \"${CI_COMMIT_SHA}\",\n    using: GitHubPRDownloadStrategy\n  version \"1234\"" < ${FORMULA_NAME}_upstream.rb >> $FORMULA_FILE
    # 4. run brew build and test
    - HOMEBREW_NO_INSTALL_FROM_API=1 brew reinstall --build-from-source --verbose --debug --formula ./${FORMULA_FILE} < /dev/null
    - brew test ./${FORMULA_FILE}
  after_script:
    - FORMULA_FILE="$(basename $[[ inputs.formula ]])"
    - FORMULA_NAME="${FORMULA_FILE%%.*}"
    - brew remove $FORMULA_NAME || true
    - rm -rf "/tmp/brew_build_${CI_PIPELINE_ID}"
