# Runner tag and retry policies for GitLab CI pipelines.
# Include this file once and reference whichever anchors you need.
#
#   include:
#     - project: Northern.tech/Mender/mendertesting
#       file: qa-common/retry.yml

# ── Retry policy ──────────────────────────────────────────────────────────────

# Retry on runner failures, OOM (exit 137), and network unavailability (exit 192).
# Exit code 192 is set by the network probes below when connectivity is absent.
#
# Pipeline-wide:
#   default:
#     retry: !reference [.qa-common-default-retry, retry]
#
# Per job:
#   my-job:
#     extends: .qa-common-default-retry
.qa-common-default-retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
    exit_codes:
      - 137
      - 192

# ── Network probes ────────────────────────────────────────────────────────────
#
# Each probe retries its connectivity check up to 4 times, then exits with
# code 192 if the network is still unavailable.  Use them in before_script so
# the job is retried (via .qa-common-default-retry) instead of failing hard.
#
# Example combining retry policy with a network probe:
#   my-job:
#     extends: .qa-common-default-retry
#     before_script:
#       - !reference [.qa-common-network-apt-retry, before_script]

# Verify apt network access.
#
#   before_script:
#     - !reference [.qa-common-network-apt-retry, before_script]
.qa-common-network-apt-retry:
  before_script:
    - NETWORK_RETRY_SLEEP_S=10
    - APT_UPDATED=false
    - for try in 4 3 2 1; do
    -  apt-get update --assume-yes && APT_UPDATED=true
    -  if [ "${APT_UPDATED}" == "true" ]; then
    -   break
    -  fi
    -  sleep "${NETWORK_RETRY_SLEEP_S}"
    - done
    - if [ "${APT_UPDATED}" != "true" ]; then
    -  exit 192
    - fi

# Verify Go module network access.
#
#   before_script:
#     - !reference [.qa-common-network-go-retry, before_script]
.qa-common-network-go-retry:
  before_script:
    - NETWORK_RETRY_SLEEP_S=2
    - NETWORK_RUNNING=false
    - TEST_GO_PACKAGE="${GO_NETWORK_TEST_PACKAGE:-rsc.io/quote@v1.5.2}"
    - for try in 4 3 2 1; do
    -  go list -mod=readonly -m "${TEST_GO_PACKAGE}" && NETWORK_RUNNING=true
    -  if [ "${NETWORK_RUNNING}" == "true" ]; then
    -   break
    -  fi
    -  sleep "${NETWORK_RETRY_SLEEP_S}"
    - done
    - if [ "${NETWORK_RUNNING}" != "true" ]; then
    -  exit 192
    - fi

# Verify GitHub git-clone network access.
#
#   before_script:
#     - !reference [.qa-common-network-git-clone-retry, before_script]
.qa-common-network-git-clone-retry:
  before_script:
    - NETWORK_RETRY_SLEEP_S=10
    - NETWORK_RUNNING=false
    - TEST_GIT_REPO="https://github.com/octocat/Hello-World.git"
    - for try in 4 3 2 1; do
    -  git ls-remote --exit-code "${TEST_GIT_REPO}" HEAD && NETWORK_RUNNING=true
    -  if [ "${NETWORK_RUNNING}" == "true" ]; then
    -   break
    -  fi
    -  sleep "${NETWORK_RETRY_SLEEP_S}"
    - done
    - if [ "${NETWORK_RUNNING}" != "true" ]; then
    -  exit 192
    - fi

# Verify that docker dind is active and certs are in place
#
#   before_script:
#     - !reference [.qa-common-wait-for-dind, before_script]
.qa-common-wait-for-dind:
  before_script:
    - DIND_ALIVE=false
    - for try in 4 3 2 1; do
    -   if docker info >/dev/null 2>&1; then
    -     DIND_ALIVE=true
    -     break
    -   fi
    -   echo "Waiting for Docker daemon..."
    -   sleep 5
    - done
    - if [ "${DIND_ALIVE}" != "true" ]; then
    -   echo "Dind service is down"
    -   exit 192
    - fi

# ── Command retries ───────────────────────────────────────────────────────────
#
# The probes above check connectivity once, up front, then rely on the job
# retrying from scratch (via .qa-common-default-retry) if it wasn't there.
# That doesn't help when the thing that can fail runs more than once over the
# life of a job (e.g. cloning several repos in a loop) - connectivity can be
# fine when the job starts and still fail three repos in. Use this instead to
# retry the actual flaky command, in place, every time it runs.
#
# Source it once per script, then wrap any command:
#
#   script:
#     - !reference [.qa-common-retry-command, script]
#     - retry_command 5 -- git clone https://github.com/foo/bar
#     - retry_command 3 -- curl -fsSL https://example.com/install.sh -o install.sh
#
# Exits non-zero (does not exit the job outright) after the command has
# failed `max` times, so callers can decide what to do next - e.g. treat it
# as fatal, or exit 192 to fall back on a whole-job retry via
# .qa-common-default-retry.
.qa-common-retry-command:
  script:
    - |
      retry_command() {
        local max="$1"; shift
        [ "$1" = "--" ] && shift
        local attempt=1
        while true; do
          "$@" && return 0
          if [ "${attempt}" -ge "${max}" ]; then
            echo "ERROR: command failed after ${max} attempts: $*" >&2
            return 1
          fi
          echo "WARN: attempt ${attempt}/${max} failed: $*; retrying in ${attempt}s" >&2
          sleep "${attempt}"
          attempt=$((attempt + 1))
        done
      }
