variables:
  GITHUB_AUTH: "Authorization: bearer $GITHUB_BOT_TOKEN_REPO_STATUS"

  GITHUB_STATUS_API_JSON_F: '{"state": "%s", "context": "ci/gitlab", "target_url": "%s", "description": "%s"}'

stages:
  # These have no effect and are only for documentation purposes. .pre and .post
  # stages run at the very start and very end of a pipeline, regardless of where
  # they are defined.
  - .pre
  - .post

.github_status_template:
  tags:
    - k8s-small
  # Keep overhead low by using a small image with curl preinstalled.
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/curlimages/curl-base
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  before_script:
    - |
      # GitLab groups do not always match the GitHub org they mirror.
      if [ -z "$GITHUB_ORG" ]; then
        case "$(printf '%s' "${CI_PROJECT_NAMESPACE##*/}" | tr 'A-Z' 'a-z')" in
          northerntechhq) GITHUB_ORG="NorthernTechHQ" ;;
          cfengine)       GITHUB_ORG="cfengine" ;;
          *)              GITHUB_ORG="mendersoftware" ;;
        esac
      fi
      : "${GITHUB_STATUS_API_URL:=https://api.github.com/repos/$GITHUB_ORG/$CI_PROJECT_NAME/statuses/$CI_COMMIT_SHA}"
    - |
      send_status() {
        local status="$1"
        local message="$2"

        local json="$(printf "$GITHUB_STATUS_API_JSON_F" "$status" "$CI_PIPELINE_URL" "$message")"
        local body_f="$(mktemp)"
        local hdr_f="$(mktemp)"
        local code="$(curl -sS -o "$body_f" -D "$hdr_f" -w '%{http_code}' \
                        -H "$GITHUB_AUTH" -d "$json" "$GITHUB_STATUS_API_URL")"
        local remaining="$(sed -n 's/^[Xx]-[Rr]ate[Ll]imit-[Rr]emaining: *\([0-9]*\).*/\1/p' "$hdr_f" | tail -1)"
        local ret=0

        case "$code" in
          2??)
            if [ -n "$remaining" ]; then
              echo "msg=github_status_update result=ok remaining=$remaining"
            fi
            ;;
          403|429)
            local retry_after="$(sed -n 's/^[Rr]etry-[Aa]fter: *\([0-9]*\).*/\1/p' "$hdr_f" | tail -1)"
            if [ "$remaining" = "0" ] || [ -n "$retry_after" ]; then
              echo "msg=github_status_update result=rate_limited code=$code remaining=${remaining:-0} retry_after=${retry_after:-0}" 1>&2
            else
              echo "msg=github_status_update result=forbidden code=$code" 1>&2
              cat "$body_f" 1>&2
              ret=1
            fi
            ;;
          *)
            if grep -q "This SHA and context has reached the maximum number of statuses" "$body_f"; then
              # This can happen for pipelines that keep running on the same master commit over and
              # over, such as mender-api-docs.
              :
            else
              echo "msg=github_status_update result=failed code=$code url=$GITHUB_STATUS_API_URL" 1>&2
              cat "$body_f" 1>&2
              ret=1
            fi
            ;;
        esac

        rm -f "$body_f" "$hdr_f"
        return $ret
      }

github:start:
  extends: .github_status_template
  dependencies: []
  stage: .pre
  script:
    - send_status pending "Pipeline running on Gitlab"

github:success:
  extends: .github_status_template
  # Remove dependencies so that we don't download all previous jobs artifacts
  # Note that we cannot use "needs" as this job has to be run in the correct stage
  dependencies: []
  stage: .post
  when: on_success
  script:
    - send_status success "Pipeline passed on Gitlab"

github:failure:
  extends: .github_status_template
  # Remove dependencies so that we don't download all previous jobs artifacts
  # Note that we cannot use "needs" as this job has to be run in the correct stage
  dependencies: []
  stage: .post
  when: on_failure
  script:
    - send_status failure "Pipeline failed on Gitlab"

